<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Boot 版本</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1d2129; --muted:#4e5969; --line:#e5e6eb; --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f6f7f9; font-family:var(--font); font-size:15px; line-height:1.5; }
    main { width:min(880px, calc(100% - 40px)); margin:0 auto; padding:40px 0 64px; }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.03em; }
    .lead { margin:0 0 24px; color:var(--muted); }
    a.card { display:grid; grid-template-columns:88px 1fr; gap:8px 16px; margin:0 0 12px; padding:16px 18px; background:#fff; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
    a.card:hover { border-color:#1d2129; }
    a.card:focus-visible { outline:2px solid #165dff; outline-offset:2px; }
    .no { font-weight:700; color:#165dff; }
    strong { font-size:16px; }
    span { grid-column:2; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>六版对照</h1>
    <p class="lead">第一版保留。下面五版是不同的导航结构，功能都是同一套。</p>
    <a class="card" href="index.html"><b class="no">01</b><strong>图标栏</strong><span>当前保留的这一版。最左是产品图标，中间是功能列表，首页是工作台。</span></a>
    <a class="card" href="v2-tabs.html"><b class="no">02</b><strong>顶栏</strong><span>产品放在页面顶部，功能变成下面一排标签。适合功能要横着扫。</span></a>
    <a class="card" href="v3-night.html"><b class="no">03</b><strong>夜间</strong><span>深色界面。功能全在左侧，右边是内容。</span></a>
    <a class="card" href="v4-launcher.html"><b class="no">04</b><strong>应用中心</strong><span>先看到全部功能图标，点进去才是列表，可以返回工作台。</span></a>
    <a class="card" href="v5-grouped.html"><b class="no">05</b><strong>分组侧栏</strong><span>一条宽侧栏，所有功能按组排开，每一行更高。</span></a>
    <a class="card" href="v6-search.html"><b class="no">06</b><strong>搜索优先</strong><span>左侧先放搜索，功能列表跟着结果收窄。</span></a>
  </main>
</body>
</html>
