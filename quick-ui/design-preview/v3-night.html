<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Boot · 夜间</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#12141a; --card:#1a1f27; --ink:#e8eaed; --muted:#9aa6b2; --line:#2c3340; --field:#9aa6b2; --primary:#8eb6ff; --btn:#1d4ed8; --btn-press:#1e40af; --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } [hidden]{display:none !important;} html,body{height:100%;}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:var(--font);font-size:14px;line-height:1.5;}
    button,input{font:inherit;color:inherit;} button{cursor:pointer;}
    :focus{outline:none;} :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
    svg{display:block;}
    .app{height:100%;display:flex;min-height:0;}
    .side{width:280px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg);}
    .brand{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:700;text-align:left;}
    .logo{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--btn);color:#fff;font-size:14px;}
    .find{padding:0 12px 10px;}
    .find input{width:100%;height:40px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:#12141a;color:var(--ink);}
    .nav{flex:1;overflow:auto;padding:0 8px 12px;}
    .group-name{margin:14px 8px 4px;color:var(--muted);font-size:12px;font-weight:600;}
    .item{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left;}
    .item svg{width:16px;height:16px;color:var(--muted);}
    .item:hover{background:#222836;}
    .item.is-active{background:#243044;color:var(--primary);font-weight:600;}
    .item.is-active svg{color:var(--primary);}
    .empty{margin:12px;color:var(--muted);}
    .main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);}
    .status{margin:0;padding:16px 24px 0;color:#7dcea0;font-weight:600;} .status:empty{display:none;}
    #view{flex:1;overflow:auto;}
    .page{padding:8px 24px 32px;}
    .page-head{display:flex;align-items:center;gap:12px;min-height:64px;}
    .page-head h1,.page h1{margin:0;font-size:22px;font-weight:600;}
    .page-head p,.lead{margin:0;color:var(--muted);} .lead{margin-top:8px;max-width:40em;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:12px;text-align:left;}
    th{color:var(--muted);font-weight:500;}
    td{border-top:1px solid var(--line);}
    .btn{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-weight:500;}
    .btn-primary{background:var(--btn);color:#fff;} .btn-primary:hover{background:var(--btn-press);}
    .btn-text{color:var(--primary);} .btn-text:hover{background:#243044;}
    .btn-danger{color:#ffb4b0;} .btn-danger:hover{background:#3a2426;}
    .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;}
    .ok{background:#173528;color:#8ee0b0;} .off{background:#2a303a;color:var(--muted);} .bad{background:#3a2426;color:#ffb4b0;}
    .user{position:relative;padding:12px;}
    .who{height:40px;width:100%;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-weight:600;}
    .menu{position:absolute;left:12px;right:12px;bottom:58px;padding:6px;background:#222836;border:1px solid var(--line);border-radius:8px;z-index:5;}
    .menu button{display:block;width:100%;height:36px;border:0;border-radius:6px;background:transparent;color:var(--ink);text-align:left;padding:0 10px;}
    .menu button:hover{background:#2c3442;}
    .switch{position:fixed;right:16px;bottom:12px;color:var(--muted);font-size:12px;}
    .gate{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:var(--bg);color:var(--ink);}
    .card{width:min(400px,100%);padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;}
    .card h1{margin:16px 0 6px;font-size:22px;} .card .lead{margin:0 0 16px;color:var(--muted);}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;} .field span{font-weight:500;}
    .control{height:36px;width:100%;padding:0 10px;border:1px solid var(--field);border-radius:6px;background:var(--bg);color:var(--ink);}
    .go{width:100%;height:36px;border:0;border-radius:6px;background:var(--btn);color:#fff;}
    .error-summary{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:#3a2426;color:#ffb4b0;}
    .error-summary p{margin:0 0 4px;font-weight:600;} .error-summary ul{margin:0;padding-left:18px;} .error-summary a{color:#ffb4b0;}
    .field-error{margin:4px 0 0;color:#ffb4b0;font-size:13px;}
    .check{display:flex;align-items:center;gap:8px;min-height:32px;}
    .modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;}
    .modal__scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);}
    .modal__panel{position:relative;width:min(420px,100%);padding:20px;background:var(--card);border-radius:12px;color:var(--ink);}
    .modal__panel h2{margin:0 0 14px;font-size:16px;}
    .modal__actions{display:flex;justify-content:flex-end;gap:8px;}
    .blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:20px;}
    .block{display:flex;align-items:center;gap:10px;height:64px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);text-align:left;font-weight:500;}
    .block:hover{border-color:var(--primary);}
    .block svg{width:18px;height:18px;color:var(--primary);}
    .section{margin-top:18px;} .section h2{margin:0 0 8px;color:var(--muted);font-size:13px;}
    @media (max-width:800px){ .app{flex-direction:column;} .side{width:100%;max-height:46vh;} }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <button type="button" class="brand" id="go-home"><span class="logo">Q</span>Quick Boot</button>
      <label class="find"><span class="sr">搜索功能</span><input id="menu-q" placeholder="搜索功能" autocomplete="off"></label>
      <nav class="nav" id="nav" aria-label="功能菜单"></nav>
      <div class="user">
        <button type="button" class="who" id="who" aria-expanded="false" aria-controls="user-menu">管理员</button>
        <div class="menu" id="user-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="go-profile">个人中心</button>
          <button type="button" role="menuitem" id="logout">退出登录</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <p class="status" id="status" role="status"></p>
      <div id="view"></div>
    </main>
  </div>
  <a class="switch" href="versions.html">全部版本</a>
  <div class="gate" id="gate" hidden>
    <form class="card" id="login-form" novalidate>
      <div class="logo" aria-hidden="true">Q</div>
      <h1>欢迎回来</h1>
      <p class="lead">登录后可以进入全部功能。</p>
      <div class="error-summary" id="login-errors" role="alert" tabindex="-1" hidden><p>还不能进入</p><ul id="login-error-list"></ul></div>
      <label class="field"><span>账号</span><input class="control" id="login-user" autocomplete="username" aria-describedby="login-user-error"><p class="field-error" id="login-user-error" hidden>请填写账号</p></label>
      <label class="field"><span>密码</span><input class="control" id="login-pass" type="password" autocomplete="current-password" aria-describedby="login-pass-error"><p class="field-error" id="login-pass-error" hidden>请填写密码</p></label>
      <label class="check"><input type="checkbox">记住这台设备</label>
      <button class="go" type="submit">进入</button>
    </form>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <form class="modal__panel" id="add-form">
      <h2 id="add-title">新增</h2>
      <label class="field"><span id="add-label">名称</span><input class="control" id="add-name" autocomplete="off"><p class="field-error" id="add-error" hidden>请填写名称</p></label>
      <div class="modal__actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div>
  <style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
  <script src="shared.js"></script>
  <script>
    function render() {
      const groups = QB.groupsFor(QB.query() ? null : null)
      const nav = document.getElementById('nav')
      nav.innerHTML = groups.length ? groups.map((group) => '<div class="group-name">' + group.name + '</div>' + group.items.map((item) => '<button type="button" class="item' + (item.id === QB.state.current ? ' is-active' : '') + '" data-open="' + item.id + '">' + QB.icon(item.id) + item.label + '</button>').join('')).join('') : '<p class="empty">没有这个功能。换个词再搜。</p>'
      const page = QB.page()
      const view = document.getElementById('view')
      if (page.kind === 'home') {
        const blocks = QB.GROUPS.filter((group) => group.area !== 'home').map((group) => '<section class="section"><h2>' + group.name + '</h2><div class="blocks">' + group.items.map((item) => '<button type="button" class="block" data-open="' + item.id + '">' + QB.icon(item.id) + item.label + '</button>').join('') + '</div></section>').join('')
        view.innerHTML = '<div class="page"><h1>工作台</h1><p class="lead">夜间界面。功能都在左边，这里按产品再排一遍。</p>' + blocks + '</div>'
      } else if (page.kind === 'profile') view.innerHTML = '<div class="page"><h1>个人中心</h1><p class="lead">管理员。退出后会回到登录。</p></div>'
      else view.innerHTML = '<div class="page">' + QB.listHTML() + '</div>'
    }
    QB.on(render); QB.bind(); render()
  </script>
</body>
</html>
