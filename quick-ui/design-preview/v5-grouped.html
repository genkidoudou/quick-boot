<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Boot · 分组侧栏</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1d1d1f; --muted:#4e5969; --line:#d2d2d7; --field:#86909c; --bg:#e8e8ed; --primary:#0071e3; --press:#005bb8; --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } [hidden]{display:none !important;} html,body{height:100%;}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:var(--font);font-size:15px;line-height:1.5;}
    button,input{font:inherit;color:inherit;} button{cursor:pointer;}
    :focus{outline:none;} :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
    svg{display:block;}
    .app{height:100%;display:flex;min-height:0;padding:16px;gap:16px;}
    .side{width:320px;flex:none;min-height:0;display:flex;flex-direction:column;}
    .brand{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px;border:0;background:transparent;font-size:20px;font-weight:700;text-align:left;}
    .find{padding:8px 0 12px;}
    .find input{width:100%;height:40px;padding:0 12px;border:1px solid var(--field);border-radius:10px;background:#fff;}
    .nav{flex:1;overflow:auto;padding-right:4px;}
    .group{margin:0 0 16px;background:#fff;border-radius:12px;overflow:hidden;}
    .group-name{margin:0;padding:10px 14px 0;color:var(--muted);font-size:12px;font-weight:600;}
    .item{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px;border:0;border-top:1px solid #ececf0;background:#fff;text-align:left;}
    .group .item:first-of-type{border-top:0;}
    .item svg{width:18px;height:18px;color:var(--muted);}
    .item.is-active{background:var(--primary);color:#fff;font-weight:600;}
    .item.is-active svg{color:#fff;}
    .empty{margin:8px;color:var(--muted);}
    .stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;}
    .bar{display:flex;align-items:center;justify-content:flex-end;height:56px;padding:0 16px;}
    .user{position:relative;}
    .who{height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--bg);font-weight:600;}
    .menu{position:absolute;right:0;top:42px;min-width:140px;padding:6px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;}
    .menu button{display:block;width:100%;height:40px;border:0;border-radius:8px;background:transparent;text-align:left;padding:0 10px;}
    .menu button:hover{background:var(--bg);}
    .status{margin:0 20px;color:#087443;font-weight:600;} .status:empty{display:none;}
    #view{flex:1;overflow:auto;}
    .page{padding:4px 24px 28px;}
    .page-head{display:flex;align-items:center;gap:12px;min-height:48px;}
    .page-head h1,.page h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;}
    .page-head p,.lead{margin:0;color:var(--muted);} .lead{margin-top:8px;}
    .table-wrap{overflow-x:auto;margin-top:8px;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:14px 8px;text-align:left;}
    th{color:var(--muted);font-size:13px;font-weight:600;border-bottom:1px solid var(--line);}
    td{border-bottom:1px solid #ececf0;}
    .btn{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;}
    .btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--press);}
    .btn-text{color:var(--primary);} .btn-text:hover{background:#e8f2fc;}
    .btn-danger{color:#cb272d;} .btn-danger:hover{background:#ffece8;}
    .pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;}
    .ok{background:#e7f6ee;color:#087443;} .off{background:#f2f2f7;color:var(--muted);} .bad{background:#ffece8;color:#cb272d;}
    .switch{position:fixed;right:28px;bottom:12px;color:var(--muted);font-size:12px;}
    .gate{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:var(--bg);}
    .card{width:min(400px,100%);padding:28px 24px;background:#fff;border-radius:16px;}
    .card h1{margin:0 0 6px;font-size:28px;} .card .lead{margin:0 0 16px;color:var(--muted);}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;} .field span{font-weight:600;}
    .control{height:40px;width:100%;padding:0 12px;border:1px solid var(--field);border-radius:10px;}
    .go{width:100%;height:44px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;}
    .error-summary{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#ffece8;color:#cb272d;}
    .error-summary p{margin:0 0 4px;font-weight:600;} .error-summary ul{margin:0;padding-left:18px;} .error-summary a{color:#cb272d;}
    .field-error{margin:4px 0 0;color:#cb272d;font-size:13px;}
    .check{display:flex;align-items:center;gap:8px;min-height:32px;} .check input{accent-color:var(--primary);}
    .modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;}
    .modal__scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);}
    .modal__panel{position:relative;width:min(420px,100%);padding:20px;background:#fff;border-radius:16px;}
    .modal__panel h2{margin:0 0 14px;font-size:18px;}
    .modal__actions{display:flex;justify-content:flex-end;gap:8px;}
    @media (max-width:800px){ .app{flex-direction:column;padding:8px;} .side{width:100%;max-height:48vh;} .page-head h1,.page h1{font-size:24px;} }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <button type="button" class="brand" id="go-home">Quick Boot</button>
      <label class="find"><span class="sr">搜索功能</span><input id="menu-q" placeholder="搜索功能" autocomplete="off"></label>
      <nav class="nav" id="nav" aria-label="功能菜单"></nav>
    </aside>
    <main class="stage">
      <div class="bar">
        <div class="user">
          <button type="button" class="who" id="who" aria-expanded="false" aria-controls="user-menu">管理员</button>
          <div class="menu" id="user-menu" role="menu" hidden>
            <button type="button" role="menuitem" id="go-profile">个人中心</button>
            <button type="button" role="menuitem" id="logout">退出登录</button>
          </div>
        </div>
      </div>
      <p class="status" id="status" role="status"></p>
      <div id="view"></div>
    </main>
  </div>
  <a class="switch" href="versions.html">全部版本</a>
  <div class="gate" id="gate" hidden>
    <form class="card" id="login-form" novalidate>
      <h1>欢迎回来</h1>
      <p class="lead">登录后可以进入全部功能。</p>
      <div class="error-summary" id="login-errors" role="alert" tabindex="-1" hidden><p>还不能进入</p><ul id="login-error-list"></ul></div>
      <label class="field"><span>账号</span><input class="control" id="login-user" autocomplete="username" aria-describedby="login-user-error"><p class="field-error" id="login-user-error" hidden>请填写账号</p></label>
      <label class="field"><span>密码</span><input class="control" id="login-pass" type="password" autocomplete="current-password" aria-describedby="login-pass-error"><p class="field-error" id="login-pass-error" hidden>请填写密码</p></label>
      <label class="check"><input type="checkbox">记住这台设备</label>
      <button class="go" type="submit">进入</button>
    </form>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <form class="modal__panel" id="add-form">
      <h2 id="add-title">新增</h2>
      <label class="field"><span id="add-label">名称</span><input class="control" id="add-name" autocomplete="off"><p class="field-error" id="add-error" hidden>请填写名称</p></label>
      <div class="modal__actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div>
  <style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
  <script src="shared.js"></script>
  <script>
    function render() {
      const groups = QB.groupsFor(null)
      document.getElementById('nav').innerHTML = groups.length ? groups.map((group) => '<section class="group"><h2 class="group-name">' + group.name + '</h2>' + group.items.map((item) => '<button type="button" class="item' + (item.id === QB.state.current ? ' is-active' : '') + '" data-open="' + item.id + '">' + QB.icon(item.id) + item.label + '</button>').join('') + '</section>').join('') : '<p class="empty">没有这个功能。换个词再搜。</p>'
      const page = QB.page()
      const view = document.getElementById('view')
      if (page.kind === 'home') view.innerHTML = '<div class="page"><h1>工作台</h1><p class="lead">全部功能都在左边，按组排开。点一项，内容出现在这里。</p></div>'
      else if (page.kind === 'profile') view.innerHTML = '<div class="page"><h1>个人中心</h1><p class="lead">管理员。退出后会回到登录。</p></div>'
      else view.innerHTML = '<div class="page">' + QB.listHTML() + '</div>'
    }
    QB.on(render); QB.bind(); render()
  </script>
</body>
</html>
