<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Boot · 应用中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1d2129; --muted:#4e5969; --line:#e5e6eb; --field:#86909c; --bg:#f2f3f5; --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } [hidden]{display:none !important;} html,body{height:100%;}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:var(--font);font-size:14px;line-height:1.5;}
    button,input{font:inherit;color:inherit;} button{cursor:pointer;}
    :focus{outline:none;} :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
    svg{display:block;}
    .app{min-height:100%;}
    .top{display:flex;align-items:center;gap:12px;height:64px;padding:0 28px;}
    .logo{width:32px;height:32px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;}
    .brand{font-size:16px;font-weight:700;}
    .spacer{margin-left:auto;}
    .user{position:relative;}
    .who{height:36px;padding:0 12px;border:0;border-radius:999px;background:#fff;font-weight:600;}
    .menu{position:absolute;right:0;top:42px;min-width:140px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(29,33,41,.12);z-index:5;}
    .menu button{display:block;width:100%;height:36px;border:0;border-radius:8px;background:transparent;text-align:left;padding:0 10px;}
    .menu button:hover{background:var(--bg);}
    .wrap{width:min(980px,calc(100% - 48px));margin:0 auto;padding-bottom:48px;}
    .find input{width:100%;height:52px;padding:0 16px;border:1px solid var(--field);border-radius:14px;background:#fff;font-size:16px;}
    .status{margin:12px 0 0;color:#087443;font-weight:600;} .status:empty{display:none;}
    .page-head{display:flex;align-items:center;gap:12px;min-height:56px;}
    .page-head h1{margin:0;font-size:22px;font-weight:600;}
    .page-head p,.lead{margin:8px 0 0;color:var(--muted);}
    .section{margin-top:28px;}
    .section h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px;}
    .tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:transparent;font-weight:500;}
    .glyph{width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:#fff;border:1px solid var(--line);}
    .tile:hover .glyph{border-color:var(--ink);}
    .glyph svg{width:26px;height:26px;}
    .back{height:36px;margin:16px 0;padding:0 12px;border:0;border-radius:8px;background:#fff;font-weight:600;}
    .table-wrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid var(--line);}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:12px 14px;text-align:left;}
    th{color:var(--muted);font-weight:500;background:#fafafa;}
    td{border-top:1px solid var(--line);}
    .btn{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:500;}
    .btn-primary{background:var(--ink);color:#fff;} .btn-primary:hover{background:#000;}
    .btn-text{color:var(--ink);font-weight:600;} .btn-text:hover{background:#f2f3f5;}
    .btn-danger{color:#cb272d;} .btn-danger:hover{background:#ffece8;}
    .pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:4px;font-size:12px;}
    .ok{background:#e7f6ee;color:#087443;} .off{background:#f2f3f5;color:var(--muted);} .bad{background:#ffece8;color:#cb272d;}
    .switch{position:fixed;right:16px;bottom:12px;color:var(--muted);font-size:12px;}
    .empty{color:var(--muted);}
    .gate{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:var(--bg);}
    .card{width:min(400px,100%);padding:28px 24px;background:#fff;border-radius:16px;}
    .card h1{margin:16px 0 6px;font-size:22px;} .card .lead{margin:0 0 16px;color:var(--muted);}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;} .field span{font-weight:500;}
    .control{height:40px;width:100%;padding:0 12px;border:1px solid var(--field);border-radius:10px;}
    .go{width:100%;height:44px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;}
    .error-summary{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#ffece8;color:#cb272d;}
    .error-summary p{margin:0 0 4px;font-weight:600;} .error-summary ul{margin:0;padding-left:18px;} .error-summary a{color:#cb272d;}
    .field-error{margin:4px 0 0;color:#cb272d;font-size:13px;}
    .check{display:flex;align-items:center;gap:8px;min-height:32px;}
    .modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;}
    .modal__scrim{position:absolute;inset:0;background:rgba(29,33,41,.45);}
    .modal__panel{position:relative;width:min(420px,100%);padding:20px;background:#fff;border-radius:16px;}
    .modal__panel h2{margin:0 0 14px;font-size:16px;}
    .modal__actions{display:flex;justify-content:flex-end;gap:8px;}
    @media (max-width:800px){ .wrap{width:calc(100% - 32px);} .grid{grid-template-columns:repeat(3,1fr);} }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button type="button" class="logo" id="go-home" aria-label="回到首页">Q</button>
      <span class="brand">Quick Boot</span>
      <div class="spacer"></div>
      <div class="user">
        <button type="button" class="who" id="who" aria-expanded="false" aria-controls="user-menu">管理员</button>
        <div class="menu" id="user-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="go-profile">个人中心</button>
          <button type="button" role="menuitem" id="logout">退出登录</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <label class="find"><span class="sr">搜索功能</span><input id="menu-q" placeholder="搜索功能" autocomplete="off"></label>
      <p class="status" id="status" role="status"></p>
      <div id="view"></div>
    </div>
  </div>
  <a class="switch" href="versions.html">全部版本</a>
  <div class="gate" id="gate" hidden>
    <form class="card" id="login-form" novalidate>
      <div class="logo" aria-hidden="true" style="display:grid;place-items:center">Q</div>
      <h1>欢迎回来</h1>
      <p class="lead">登录后可以进入全部功能。</p>
      <div class="error-summary" id="login-errors" role="alert" tabindex="-1" hidden><p>还不能进入</p><ul id="login-error-list"></ul></div>
      <label class="field"><span>账号</span><input class="control" id="login-user" autocomplete="username" aria-describedby="login-user-error"><p class="field-error" id="login-user-error" hidden>请填写账号</p></label>
      <label class="field"><span>密码</span><input class="control" id="login-pass" type="password" autocomplete="current-password" aria-describedby="login-pass-error"><p class="field-error" id="login-pass-error" hidden>请填写密码</p></label>
      <label class="check"><input type="checkbox">记住这台设备</label>
      <button class="go" type="submit">进入</button>
    </form>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <form class="modal__panel" id="add-form">
      <h2 id="add-title">新增</h2>
      <label class="field"><span id="add-label">名称</span><input class="control" id="add-name" autocomplete="off"><p class="field-error" id="add-error" hidden>请填写名称</p></label>
      <div class="modal__actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div>
  <style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
  <script src="shared.js"></script>
  <script>
    function tiles(groups) {
      if (!groups.length) return '<p class="empty">没有这个功能。换个词再搜。</p>'
      return groups.filter((group) => group.area !== 'home').map((group) => '<section class="section"><h2>' + group.name + '</h2><div class="grid">' + group.items.map((item) => '<button type="button" class="tile" data-open="' + item.id + '"><span class="glyph">' + QB.icon(item.id) + '</span>' + item.label + '</button>').join('') + '</div></section>').join('')
    }
    function render() {
      const page = QB.page()
      const view = document.getElementById('view')
      const q = QB.query()
      if (page.kind === 'home' || q) view.innerHTML = tiles(QB.groupsFor(null).filter((group) => q || group.area !== 'home'))
      else if (page.kind === 'profile') view.innerHTML = '<div class="page"><h1>个人中心</h1><p class="lead">管理员。退出后会回到登录。</p></div>'
      else view.innerHTML = '<button type="button" class="back" data-open="home">返回工作台</button><div class="page">' + QB.listHTML() + '</div>'
    }
    QB.on(render); QB.bind(); render()
  </script>
</body>
</html>
