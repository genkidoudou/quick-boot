<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录页设计预览 · Quick Boot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --login-primary: #409eff;
      --login-primary-deep: #2b7fd4;
      --login-primary-soft: rgba(64, 158, 255, 0.12);
      --login-cyan: #06b6d4;
      --login-ink: #1e2f45;
      --login-muted: #7b8ea3;
      --login-line: #d5e1ee;
      --login-card: rgba(255, 255, 255, 0.72);
      --login-input-bg: rgba(255, 255, 255, 0.92);
      --font-display: "Outfit", "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--login-ink);
      background: #e8f1fa;
    }

    .login-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 64px;
      overflow: hidden;
    }

    /* 浅色科技玻璃：冰雪白底 + 淡蓝青光晕 + 透视网格 + 扫描光 + 磨砂罩 */
    .login-atmosphere {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(160, 210, 255, 0.45), transparent 60%),
        linear-gradient(155deg, #f7fbff 0%, #eaf3fc 42%, #dfeaf7 78%, #d4e4f4 100%);
    }

    .login-atmosphere__blobs {
      position: absolute;
      inset: -18%;
      filter: blur(80px);
      transform: scale(1.08);
      opacity: 0.9;
    }

    .login-atmosphere__blob {
      position: absolute;
      border-radius: 50%;
      animation: drift 20s ease-in-out infinite alternate;
    }

    .login-atmosphere__blob--1 {
      width: 56vmax;
      height: 46vmax;
      top: -20%;
      left: -14%;
      background: radial-gradient(circle, rgba(96, 180, 255, 0.55) 0%, rgba(96, 180, 255, 0) 70%);
    }

    .login-atmosphere__blob--2 {
      width: 48vmax;
      height: 42vmax;
      top: 8%;
      right: -16%;
      background: radial-gradient(circle, rgba(56, 210, 230, 0.38) 0%, rgba(56, 210, 230, 0) 72%);
      animation-delay: -6s;
      animation-duration: 24s;
    }

    .login-atmosphere__blob--3 {
      width: 54vmax;
      height: 48vmax;
      bottom: -24%;
      left: 18%;
      background: radial-gradient(circle, rgba(130, 170, 255, 0.32) 0%, rgba(130, 170, 255, 0) 70%);
      animation-delay: -12s;
      animation-duration: 28s;
    }

    .login-atmosphere__blob--4 {
      width: 36vmax;
      height: 36vmax;
      bottom: 8%;
      right: 12%;
      background: radial-gradient(circle, rgba(180, 220, 255, 0.5) 0%, rgba(180, 220, 255, 0) 70%);
      animation-delay: -3s;
      animation-duration: 22s;
    }

    .login-atmosphere__grid {
      position: absolute;
      inset: -10% -20% 0;
      background-image:
        linear-gradient(rgba(64, 140, 210, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 140, 210, 0.14) 1px, transparent 1px);
      background-size: 56px 56px;
      transform: perspective(700px) rotateX(58deg) translateY(-8%);
      transform-origin: center top;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 28%, #000 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 28%, #000 70%, transparent 100%);
      opacity: 0.42;
      animation: gridPulse 8s ease-in-out infinite alternate;
    }

    .login-atmosphere__dots {
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image: radial-gradient(rgba(80, 150, 220, 0.45) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 10%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 10%, transparent 75%);
    }

    .login-atmosphere__scan {
      position: absolute;
      left: -20%;
      width: 140%;
      height: 16%;
      top: -20%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(100, 190, 255, 0.1),
        rgba(64, 158, 255, 0.18),
        rgba(100, 190, 255, 0.1),
        transparent
      );
      animation: scanSweep 7.5s linear infinite;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .login-atmosphere__veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          155deg,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(230, 240, 250, 0.4) 100%
        );
      backdrop-filter: blur(36px) saturate(1.12);
      -webkit-backdrop-filter: blur(36px) saturate(1.12);
    }

    .login-atmosphere__grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: soft-light;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 140px 140px;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(2.5%, 3.5%) scale(1.05); }
    }

    @keyframes gridPulse {
      from { opacity: 0.3; }
      to { opacity: 0.5; }
    }

    @keyframes scanSweep {
      0% { transform: translateY(0); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateY(620%); opacity: 0; }
    }

    .preview-badge {
      position: absolute;
      z-index: 2;
      top: 16px;
      left: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #4a6d8c;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(120, 180, 230, 0.35);
      backdrop-filter: blur(10px);
      letter-spacing: 0.02em;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(380px, 100%);
      min-height: 0;
      padding: 32px 28px 18px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      background: var(--login-card);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.55) inset,
        0 0 32px rgba(64, 158, 255, 0.12),
        0 18px 48px rgba(70, 110, 160, 0.14);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(100, 190, 255, 0.7),
        rgba(255, 255, 255, 0.55) 38%,
        rgba(64, 158, 255, 0.45) 68%,
        rgba(34, 200, 220, 0.4)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .login-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 190, 255, 0.9), transparent);
      pointer-events: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .brand__logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      animation: logoSpin 12s linear infinite;
      will-change: transform;
    }

    @keyframes logoSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand__logo,
      .login-atmosphere__blob,
      .login-atmosphere__grid,
      .login-atmosphere__scan {
        animation: none;
      }
    }

    .brand__logo svg {
      width: 52px;
      height: 52px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(64, 158, 255, 0.35)) drop-shadow(0 6px 14px rgba(56, 180, 220, 0.2));
    }

    .brand__name {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--login-primary-deep);
      line-height: 1.2;
    }

    .brand__hello {
      margin: 6px 0 0;
      font-size: 0.875rem;
      color: var(--login-muted);
      font-weight: 500;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin: 16px 0 0;
      border-bottom: 1px solid var(--login-line);
      flex-shrink: 0;
    }

    .tabs__item {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 10px 4px 12px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--login-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tabs__item:hover {
      color: var(--login-ink);
    }

    .tabs__item.is-active {
      color: var(--login-primary);
      font-weight: 600;
    }

    .tabs__item.is-active::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: -1px;
      height: 2px;
      border-radius: 1px;
      background: var(--login-primary);
    }

    .pane {
      display: none;
      padding-top: 16px;
      flex: 1;
      min-width: 0;
      animation: paneIn 0.28s ease both;
    }

    .pane form {
      min-width: 0;
    }

    .pane.is-active {
      display: block;
    }

    @keyframes paneIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .field {
      margin-bottom: 12px;
      min-width: 0;
    }

    .field__control {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--login-input-bg);
      border: 1px solid var(--login-line);
      box-shadow: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-width: 0;
      width: 100%;
    }

    .field__control:focus-within {
      background: #fff;
      border-color: var(--login-primary);
      box-shadow: 0 0 0 3px var(--login-primary-soft);
    }

    .field__control svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--login-muted);
    }

    .field__control input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 0.95rem;
      color: var(--login-ink);
    }

    .field__control input::placeholder {
      color: #9aa5b1;
    }

    .field__toggle {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: var(--login-muted);
      display: grid;
      place-items: center;
    }

    .field__toggle:hover {
      color: var(--login-ink);
    }

    .meta {
      display: flex;
      align-items: center;
      margin: 0 0 14px;
      min-height: 22px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
      color: var(--login-muted);
    }

    .check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check__box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid #c5ced8;
      background: #fff;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .check__box svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      color: #fff;
    }

    .check input:checked + .check__box {
      background: var(--login-primary);
      border-color: var(--login-primary);
    }

    .check input:checked + .check__box svg {
      opacity: 1;
    }

    .btn {
      appearance: none;
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn--primary {
      color: #fff;
      background: linear-gradient(135deg, #5eb0ff 0%, #409eff 45%, #2f7fd6 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.18) inset,
        0 8px 22px rgba(64, 158, 255, 0.42);
    }

    .btn--primary:hover {
      background: linear-gradient(135deg, #6bb8ff 0%, #4aa6ff 45%, #337ecc 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.22) inset,
        0 10px 28px rgba(64, 158, 255, 0.5);
    }

    .btn--primary:active {
      transform: translateY(1px);
    }

    .btn--ghost {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      height: 36px;
      color: var(--login-ink);
      background: #fff;
      border: 1px solid var(--login-line);
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0;
      margin-top: 0;
    }

    .btn--ghost:hover {
      border-color: #c9d0d8;
      background: var(--login-primary-soft);
      color: var(--login-primary);
    }

    .oauth {
      margin-top: 14px;
    }

    .oauth__divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--login-muted);
      font-size: 0.75rem;
    }

    .oauth__divider::before,
    .oauth__divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--login-line);
    }

    .oauth__list {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    /* 验证码按钮内嵌在输入框右侧，避免撑出卡片 */
    .field__control--sms {
      gap: 8px;
      padding-right: 6px;
    }

    .field__control--sms input {
      min-width: 0;
    }

    .sms-inline-btn {
      appearance: none;
      flex: 0 0 auto;
      height: 30px;
      margin: 0;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: var(--login-primary-soft);
      color: var(--login-primary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sms-inline-btn:hover:not(:disabled) {
      background: rgba(64, 158, 255, 0.2);
    }

    .sms-inline-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .qrcode {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 8px 0 4px;
    }

    .qrcode__box {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      border: 1px solid var(--login-line);
      background:
        linear-gradient(45deg, #f3f6f9 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(-45deg, #f3f6f9 25%, transparent 25%) -12px 0 / 24px 24px,
        linear-gradient(45deg, transparent 75%, #f3f6f9 75%) 0 0 / 24px 24px,
        linear-gradient(-45deg, transparent 75%, #f3f6f9 75%) 0 0 / 24px 24px,
        #fff;
      display: grid;
      place-items: center;
      color: var(--login-muted);
      font-size: 0.8125rem;
    }

    .qrcode__box svg {
      width: 132px;
      height: 132px;
      color: var(--login-ink);
      opacity: 0.82;
    }

    .qrcode__tip {
      margin: 0;
      color: var(--login-muted);
      font-size: 0.8125rem;
      text-align: center;
      line-height: 1.5;
    }

    .card-footer {
      margin-top: 16px;
      padding-top: 0;
      text-align: center;
      font-size: 0.72rem;
      color: #9aabbc;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(28, 36, 48, 0.92);
      color: #fff;
      font-size: 0.875rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 32px 16px 56px;
      }

      .login-card {
        padding: 28px 18px 16px;
      }

      .brand__logo {
        width: 48px;
        height: 48px;
        margin-bottom: 8px;
      }

      .brand__logo svg {
        width: 48px;
        height: 48px;
      }

      .tabs__item {
        font-size: 0.8125rem;
        padding: 10px 2px 12px;
      }

      .sms-inline-btn {
        padding: 0 8px;
        font-size: 0.6875rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="preview-badge">静态设计预览 · 浅色科技玻璃</div>

    <div class="login-atmosphere" aria-hidden="true">
      <div class="login-atmosphere__blobs">
        <div class="login-atmosphere__blob login-atmosphere__blob--1"></div>
        <div class="login-atmosphere__blob login-atmosphere__blob--2"></div>
        <div class="login-atmosphere__blob login-atmosphere__blob--3"></div>
        <div class="login-atmosphere__blob login-atmosphere__blob--4"></div>
      </div>
      <div class="login-atmosphere__grid"></div>
      <div class="login-atmosphere__dots"></div>
      <div class="login-atmosphere__scan"></div>
      <div class="login-atmosphere__veil"></div>
      <div class="login-atmosphere__grain"></div>
    </div>

    <main class="login-card" aria-label="登录">
      <header class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 4L48.785 16V40L28 52L7.215 40V16L28 4Z" fill="url(#logoGrad)" />
            <path d="M28 12L41.856 20V36L28 44L14.144 36V20L28 12Z" fill="#fff" fill-opacity="0.18" />
            <path d="M24 20.5L36 28L24 35.5V20.5Z" fill="#fff" />
            <defs>
              <linearGradient id="logoGrad" x1="10" y1="8" x2="46" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#66b1ff" />
                <stop offset="1" stop-color="#409eff" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand__name">QUICK BOOT</h1>
        <p class="brand__hello">欢迎登录</p>
      </header>

      <div class="tabs" role="tablist" aria-label="登录方式">
        <button type="button" class="tabs__item is-active" role="tab" aria-selected="true" data-tab="password">账号登录</button>
        <button type="button" class="tabs__item" role="tab" aria-selected="false" data-tab="phone">手机登录</button>
        <button type="button" class="tabs__item" role="tab" aria-selected="false" data-tab="qrcode">扫码登录</button>
      </div>

      <section class="pane is-active" id="pane-password" role="tabpanel">
        <form id="form-password" autocomplete="on">
          <div class="field">
            <label class="field__control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
              <input name="username" type="text" placeholder="用户名" autocomplete="username" />
            </label>
          </div>
          <div class="field">
            <label class="field__control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <input id="password-input" name="password" type="password" placeholder="密码" autocomplete="current-password" />
              <button type="button" class="field__toggle" id="toggle-password" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </label>
          </div>
          <div class="meta">
            <label class="check">
              <input type="checkbox" name="remember" checked />
              <span class="check__box" aria-hidden="true">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6.5 4.8 9.2 10 3.2"/></svg>
              </span>
              记住密码
            </label>
          </div>
          <button type="submit" class="btn btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M10 17H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3"/><path d="M15 12H8"/><path d="m12 8 4 4-4 4"/></svg>
            登录
          </button>
          <div class="oauth">
            <div class="oauth__divider"><span>第三方登录</span></div>
            <div class="oauth__list">
              <button type="button" class="btn btn--ghost" data-oauth="Gitee">Gitee</button>
              <button type="button" class="btn btn--ghost" data-oauth="GitHub">GitHub</button>
            </div>
          </div>
        </form>
      </section>

      <section class="pane" id="pane-phone" role="tabpanel" hidden>
        <form id="form-phone">
          <div class="field">
            <label class="field__control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>
              <input name="phone" type="tel" maxlength="11" placeholder="手机号" />
            </label>
          </div>
          <div class="field">
            <label class="field__control field__control--sms">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><path d="m4 7 8 6 8-6"/></svg>
              <input name="smsCode" type="text" maxlength="6" placeholder="验证码" />
              <button type="button" class="sms-inline-btn" id="sms-btn">获取验证码</button>
            </label>
          </div>
          <button type="submit" class="btn btn--primary" style="margin-top: 4px">登录</button>
        </form>
      </section>

      <section class="pane" id="pane-qrcode" role="tabpanel" hidden>
        <div class="qrcode">
          <div class="qrcode__box" aria-label="二维码占位">
            <svg viewBox="0 0 120 120" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="8" width="36" height="36" rx="4"/>
              <rect x="16" y="16" width="20" height="20" fill="#fff"/>
              <rect x="20" y="20" width="12" height="12"/>
              <rect x="76" y="8" width="36" height="36" rx="4"/>
              <rect x="84" y="16" width="20" height="20" fill="#fff"/>
              <rect x="88" y="20" width="12" height="12"/>
              <rect x="8" y="76" width="36" height="36" rx="4"/>
              <rect x="16" y="84" width="20" height="20" fill="#fff"/>
              <rect x="20" y="88" width="12" height="12"/>
              <rect x="56" y="8" width="10" height="10"/>
              <rect x="56" y="28" width="10" height="10"/>
              <rect x="8" y="56" width="10" height="10"/>
              <rect x="28" y="56" width="10" height="10"/>
              <rect x="52" y="52" width="18" height="18"/>
              <rect x="76" y="56" width="10" height="10"/>
              <rect x="96" y="56" width="10" height="10"/>
              <rect x="56" y="76" width="10" height="10"/>
              <rect x="76" y="76" width="10" height="10"/>
              <rect x="96" y="76" width="10" height="10"/>
              <rect x="56" y="96" width="10" height="10"/>
              <rect x="76" y="96" width="18" height="10"/>
              <rect x="100" y="96" width="12" height="12"/>

          </div>
          <p class="qrcode__tip">使用手机扫码登录，请确保已安装对应应用</p>
        </div>
      </section>

      <footer class="card-footer">
        Copyright © 2024 Quick Boot All Rights Reserved.
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const tabs = document.querySelectorAll(".tabs__item");
    const panes = {
      password: document.getElementById("pane-password"),
      phone: document.getElementById("pane-phone"),
      qrcode: document.getElementById("pane-qrcode"),
    };
    const toastEl = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("is-show"), 1800);
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const key = tab.dataset.tab;
        tabs.forEach((t) => {
          const active = t === tab;
          t.classList.toggle("is-active", active);
          t.setAttribute("aria-selected", active ? "true" : "false");
        });
        Object.entries(panes).forEach(([name, pane]) => {
          const active = name === key;
          pane.classList.toggle("is-active", active);
          pane.hidden = !active;
        });
      });
    });

    document.getElementById("toggle-password").addEventListener("click", () => {
      const input = document.getElementById("password-input");
      input.type = input.type === "password" ? "text" : "password";
    });

    document.getElementById("form-password").addEventListener("submit", (e) => {
      e.preventDefault();
      showToast("静态预览：账号登录不会真正提交");
    });

    document.getElementById("form-phone").addEventListener("submit", (e) => {
      e.preventDefault();
      showToast("静态预览：手机登录不会真正提交");
    });

    document.querySelectorAll("[data-oauth]").forEach((btn) => {
      btn.addEventListener("click", () => {
        showToast("静态预览：跳转 " + btn.dataset.oauth);
      });
    });

    const smsBtn = document.getElementById("sms-btn");
    let countdown = 0;
    let smsTimer;
    smsBtn.addEventListener("click", () => {
      if (countdown > 0) return;
      countdown = 60;
      smsBtn.disabled = true;
      smsBtn.textContent = countdown + "s";
      showToast("静态预览：验证码已发送（模拟）");
      smsTimer = setInterval(() => {
        countdown -= 1;
        if (countdown <= 0) {
          clearInterval(smsTimer);
          smsBtn.disabled = false;
          smsBtn.textContent = "获取验证码";
          return;
        }
        smsBtn.textContent = countdown + "s";
      }, 1000);
    });
  </script>
</body>
</html>
