<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案 B · 发送工作台（完整）</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c0f14; --panel:#151a22; --panel2:#1c222d; --line:#2a3342;
      --ink:#e8edf5; --mute:#8b95a8; --accent:#ea580c; --ok:#34d399; --bad:#fb7185;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Space Grotesk","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
    .top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
    .top a{color:var(--mute);text-decoration:none;font-size:13px}
    .top nav{display:flex;gap:6px;flex-wrap:wrap}
    .top nav button{border:1px solid transparent;background:transparent;color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
    .top nav button.on{color:var(--ink);background:var(--panel2);border-color:var(--line)}
    .page{width:min(1180px,calc(100% - 24px));margin:16px auto 40px;display:none}
    .page.on{display:block}
    .layout{display:grid;grid-template-columns:1fr 320px;gap:14px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
    h2{margin:0 0 12px;font-size:15px}
    .lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 6px}
    input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;font-size:14px}
    textarea{min-height:160px;resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:13px}
    .row{margin-bottom:14px}
    .go{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
    .ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
    .danger{color:var(--bad);border-color:#7f1d1d}
    .ch label,.check label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;margin-bottom:6px;cursor:pointer}
    .tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
    .tabs button{flex:1;min-width:64px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:6px;font:inherit;font-size:12px;cursor:pointer}
    .tabs button.on{color:var(--ink);background:var(--panel2)}
    .tree,.check{max-height:240px;overflow:auto}
    .tree label{display:flex;gap:8px;padding:4px 6px;font-size:13px}
    .tree .i1{padding-left:18px}.tree .i2{padding-left:32px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--mute);font-weight:500}
    .ok{color:var(--ok)}.bad{color:var(--bad)}.mute{color:var(--mute)}
    .mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:8px;font-size:13px;display:none;z-index:40}
    .toast.on{display:block}.toast.err{background:var(--bad);color:#fff}
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
    .mask.on{display:flex}
    .sheet{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-height:90vh;overflow:auto}
    .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#262c38;font-size:11px;color:var(--mute)}
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <header class="top">
    <div><strong>发送工作台</strong> <span class="mute" style="font-size:12px">方案 B · 完整</span></div>
    <nav id="nav">
      <button class="on" data-p="compose">写消息</button>
      <button data-p="channels">渠道</button>
      <button data-p="groups">群组</button>
      <button data-p="records">记录</button>
      <button data-p="tokens">Token</button>
      <button data-p="inbox">收件箱</button>
    </nav>
    <a href="index.html">← 方案列表</a>
  </header>

  <div class="page on" id="compose">
    <div class="layout">
      <section class="card">
        <h2>撰写</h2>
        <div class="row"><label class="lbl">标题</label><input id="sTitle"></div>
        <div class="row"><label class="lbl">正文</label><textarea id="sContent"></textarea></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
          <span class="mono mute" id="est">选择接收人后显示预估</span>
          <div style="display:flex;gap:8px">
            <button class="ghost" type="button" id="preview">预览接收人</button>
            <button class="go" type="button" id="send">发送</button>
          </div>
        </div>
        <div id="sendOut" style="margin-top:14px"></div>
      </section>
      <aside class="card">
        <h2>渠道</h2>
        <div class="ch" id="sChannels"></div>
        <h2 style="margin-top:16px">接收人</h2>
        <div class="tabs" id="recvTabs">
          <button class="on" data-r="g">群组</button>
          <button data-r="d">部门</button>
          <button data-r="u">用户</button>
        </div>
        <div id="rg" class="check"></div>
        <div id="rd" class="tree" style="display:none"></div>
        <div id="ru" class="check" style="display:none"></div>
        <label class="mute" style="display:flex;gap:8px;margin-top:10px;font-size:12px"><input type="checkbox" id="sChild" checked> 部门含下级</label>
      </aside>
    </div>
  </div>

  <div class="page" id="channels"><div class="card" id="channelsBox"></div></div>
  <div class="page" id="groups"><div class="card" id="groupsBox"></div></div>
  <div class="page" id="records"><div class="card" id="recordsBox"></div></div>
  <div class="page" id="tokens"><div class="card" id="tokensBox"></div></div>
  <div class="page" id="inbox"><div class="card" id="inboxBox"></div></div>
  <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

  <script src="mock-store.js"></script>
  <script src="mock-forms.js"></script>
  <script>
    const M = MsgMock; const F = MsgForms;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const escA = (s) => esc(s).replace(/\n/g," ");
    function toast(m, err){ const t=$("toast"); t.textContent=m; t.className="toast on"+(err?" err":""); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2200); }
    function openSheet(html){ $("sheet").innerHTML=html; $("mask").classList.add("on"); }
    function closeSheet(){ $("mask").classList.remove("on"); }
    $("mask").onclick = (e)=>{ if(e.target===$("mask")) closeSheet(); };

    function setPage(p){
      document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.p===p));
      document.querySelectorAll(".page").forEach(el=>el.classList.toggle("on", el.id===p));
      refresh();
    }
    document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.p));

    function deptHtml(selected=[]) {
      const level = (id)=>{ let n=0,cur=M.depts.find(d=>d.id===id); while(cur?.parentId!=null){n++;cur=M.depts.find(d=>d.id===cur.parentId);} return n; };
      return M.depts.map(d=>`<label class="i${level(d.id)}"><input type="checkbox" value="${d.id}" ${selected.includes(d.id)?"checked":""}> ${esc(d.name)}</label>`).join("");
    }

    function refreshComposeSide(){
      $("sChannels").innerHTML = `<div class="mute" style="font-size:11px;margin-bottom:8px;line-height:1.4">群组只给站内信用；Webhook/Bean 忽略群组（对齐 PushPlus）。</div>` +
        (M.state.channels.filter(c=>c.status==="1").map(c=>`
        <label><input type="checkbox" value="${c.id}" ${c.type==="INBOX"?"checked":""}> ${esc(c.name)} <span class="tag">${esc(M.channelTypeLabel(c.type))}</span></label>`).join("") || `<div class="mute">无启用渠道</div>`);
      $("rg").innerHTML = M.state.groups.map(g=>`<label><input type="checkbox" value="${g.id}"> ${esc(g.name)}</label>`).join("") || `<div class="mute">暂无群组</div>`;
      $("ru").innerHTML = M.users.map(u=>`<label><input type="checkbox" value="${u.id}"> ${esc(u.name)}</label>`).join("");
      $("rd").innerHTML = deptHtml();
      updateEst();
      ["rg","rd","ru","sChannels"].forEach(id=>$(id).onchange=updateEst);
      $("sChild").onchange=updateEst;
    }
    function collect(){
      return {
        title:$("sTitle").value, content:$("sContent").value,
        channelIds:[...$("sChannels").querySelectorAll("input:checked")].map(i=>i.value),
        groupIds:[...$("rg").querySelectorAll("input:checked")].map(i=>i.value),
        deptIds:[...$("rd").querySelectorAll("input:checked")].map(i=>Number(i.value)),
        userIds:[...$("ru").querySelectorAll("input:checked")].map(i=>Number(i.value)),
        includeChildDepts:$("sChild").checked,
      };
    }
    function updateEst(){
      const exp=M.expandRecipients(collect());
      const hooks=[...$("sChannels").querySelectorAll("input:checked")].map(i=>M.channelById(i.value)).filter(c=>c && !M.channelUsesRecipients(c.type)).length;
      $("est").textContent=`预估 · 站内信用户 ${exp.users.length} · 外部人 ${exp.externals.length} · Webhook/Bean ${hooks}`;
    }
    $("recvTabs").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
      $("recvTabs").querySelectorAll("button").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      const map={g:"rg",d:"rd",u:"ru"};
      Object.entries(map).forEach(([k,id])=>$(id).style.display=btn.dataset.r===k?"block":"none");
    });
    $("preview").onclick=()=>{
      const exp=M.expandRecipients(collect());
      openSheet(`<h2>预览接收人</h2><p class="mute">用户 ${exp.users.length} · 外部人 ${exp.externals.length}（不入站内信）</p>
        <pre class="mono" style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px">用户：${esc(exp.users.map(u=>u.name).join("、")||"无")}
外部人：${esc(exp.externals.map(c=>c.name).join("、")||"无")}</pre>
        <div class="bar"><button class="go" type="button" id="x">关闭</button></div>`);
      $("x").onclick=closeSheet;
    };
    $("send").onclick=()=>{
      try{
        const r=M.sendMessage(collect());
        $("sendOut").innerHTML=`<h2>结果</h2><table><thead><tr><th>渠道</th><th>状态</th><th>说明</th></tr></thead><tbody>
          ${r.results.map(x=>{const ch=M.channelById(x.channelId);return `<tr><td>${esc(ch?.name)}</td><td class="${x.status==="SUCCESS"?"ok":"bad"}">${x.status}</td><td class="mute">${esc(x.detail)}</td></tr>`;}).join("")}
        </tbody></table><p class="mono mute">${esc(r.recipientSummary)} · ${esc(r.time)}</p>`;
        toast("发送完成"); refresh();
      }catch(e){toast(e.message,true);}
    };

    function refreshChannels(){
      $("channelsBox").innerHTML=`<div class="toolbar"><h2 style="margin:0;flex:1">渠道</h2><button class="go" type="button" id="newCh">新建 Webhook</button></div>
        <table><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>URL</th><th></th></tr></thead><tbody>
        ${M.state.channels.map(c=>`<tr>
          <td>${esc(c.name)}</td><td><span class="tag">${esc(M.channelTypeLabel(c.type))}</span></td>
          <td>${c.status==="1"?"启用":"停用"}</td>
          <td class="mono mute" style="max-width:200px;word-break:break-all">${esc(M.channelConfigText(c))}</td>
          <td>
            <button class="ghost" data-e="${c.id}" type="button">编辑</button>
            <button class="ghost" data-t="${c.id}" type="button">${c.status==="1"?"停用":"启用"}</button>
          </td></tr>`).join("")}
        </tbody></table>`;
      $("newCh").textContent="新建渠道";
      $("newCh").onclick=()=>editChannel();
      $("channelsBox").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editChannel(b.dataset.e));
      $("channelsBox").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
        const c=M.channelById(b.dataset.t);
        M.saveChannel({id:c.id,name:c.name,type:c.type,webhookUrl:c.webhookUrl,beanName:c.beanName,status:c.status==="1"?"0":"1",remark:c.remark});
        toast("已更新"); refresh();
      });
    }
    function editChannel(id){
      const c=id?M.channelById(id):{name:"",type:"WEBHOOK",status:"1",webhookUrl:"",beanName:"",remark:""};
      openSheet(`<h2>${id?"编辑渠道":"新建渠道"}</h2>${F.channelEditorFields(c,{isNew:!id})}
        <div class="bar"><button class="ghost" type="button" id="x">取消</button><button class="go" type="button" id="s">保存</button></div>`);
      F.wireChannelTypeToggle();
      $("x").onclick=closeSheet;
      $("s").onclick=()=>{ try{ const body=F.readChannelForm(id?c:null); M.saveChannel({...body,id:id||undefined}); closeSheet(); toast("已保存"); refresh(); }catch(e){toast(e.message,true);} };
    }

    let gDraft=null;
    function refreshGroups(){
      $("groupsBox").innerHTML=`<div class="toolbar"><h2 style="margin:0;flex:1">群组</h2><button class="go" type="button" id="newG">新建群组</button></div>
        <p class="mute" style="font-size:12px;margin:0 0 10px">群组只含接收人，不绑定渠道；发送时再选渠道。</p>
        <table><thead><tr><th>名称</th><th>概要</th><th>展开</th><th></th></tr></thead><tbody>
        ${M.state.groups.map(g=>{const s=M.groupSummary(g);return `<tr>
          <td>${esc(g.name)}</td>
          <td class="mute">用户${s.userCount} · 外部人${s.externalCount} · 部门${s.deptCount}</td>
          <td>${s.expandedUserCount}</td>
          <td>
            <button class="ghost" data-m="${g.id}" type="button">成员</button>
            <button class="ghost" data-e="${g.id}" type="button">编辑</button>
            <button class="ghost danger" data-d="${g.id}" type="button">删除</button>
          </td></tr>`;}).join("")||`<tr><td colspan="4" class="mute">暂无群组</td></tr>`}
        </tbody></table>`;
      $("newG").onclick=()=>editGroup();
      $("groupsBox").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editGroup(b.dataset.e));
      $("groupsBox").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>editMembers(b.dataset.m));
      $("groupsBox").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("删除群组？")){M.removeGroup(b.dataset.d);toast("已删除");refresh();}});
    }
    function editGroup(id){
      const g=id?M.state.groups.find(x=>x.id===id):{name:"",remark:"",userIds:[],deptIds:[],externals:[]};
      gDraft={id:id||null,name:g.name,remark:g.remark||"",userIds:[...(g.userIds||[])],deptIds:[...(g.deptIds||[])],externals:(g.externals||[]).map(x=>({...x}))};
      openSheet(`<h2>${id?"编辑群组":"新建群组"}</h2>
        <div class="row"><label class="lbl">名称</label><input id="gName" value="${escA(gDraft.name)}"></div>
        <div class="row"><label class="lbl">备注</label><input id="gRemark" value="${escA(gDraft.remark)}"></div>
        <div class="bar">
          <button class="ghost" type="button" id="x">取消</button>
          <button class="ghost" type="button" id="mem">维护成员</button>
          <button class="go" type="button" id="s">保存</button>
        </div>`);
      $("x").onclick=closeSheet;
      $("mem").onclick=()=>{gDraft.name=$("gName").value;gDraft.remark=$("gRemark").value;closeSheet();editMembers(null,true);};
      $("s").onclick=()=>{try{const saved=M.saveGroup({id:gDraft.id||undefined,name:$("gName").value,remark:$("gRemark").value,userIds:gDraft.userIds,deptIds:gDraft.deptIds,externals:gDraft.externals});gDraft.id=saved.id;closeSheet();toast("已保存");refresh();}catch(e){toast(e.message,true);}};
    }
    function editMembers(id, fromCreate){
      if(id){const g=M.state.groups.find(x=>x.id===id);gDraft={id:g.id,name:g.name,remark:g.remark||"",userIds:[...(g.userIds||[])],deptIds:[...(g.deptIds||[])],externals:(g.externals||[]).map(x=>({...x}))};}
      const d=gDraft;
      openSheet(`<h2>成员 · ${esc(d.name||"未命名")}</h2>
        <div class="tabs" id="mt"><button class="on" data-p="u">用户</button><button data-p="d">部门</button><button data-p="e">外部人</button></div>
        <div id="pu" class="check">${M.users.map(u=>`<label><input type="checkbox" value="${u.id}" ${d.userIds.includes(u.id)?"checked":""}> ${esc(u.name)}</label>`).join("")}</div>
        <div id="pd" class="tree" style="display:none">${deptHtml(d.deptIds)}</div>
        <div id="pe" style="display:none">${F.externalsEditorHtml(d.externals)}</div>
        <div class="bar"><button class="ghost" type="button" id="x">取消</button><button class="go" type="button" id="s">保存成员</button></div>`);
      F.wireExternalsEditor();
      $("mt").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
        $("mt").querySelectorAll("button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");
        $("pu").style.display=btn.dataset.p==="u"?"block":"none";
        $("pd").style.display=btn.dataset.p==="d"?"block":"none";
        $("pe").style.display=btn.dataset.p==="e"?"block":"none";
      });
      $("x").onclick=closeSheet;
      $("s").onclick=()=>{
        d.userIds=[...$("pu").querySelectorAll("input:checked")].map(i=>Number(i.value));
        d.deptIds=[...$("pd").querySelectorAll("input:checked")].map(i=>Number(i.value));
        d.externals=F.readExternalsFromEditor();
        try{M.saveGroup({id:d.id||undefined,name:d.name||"未命名群组",remark:d.remark,userIds:d.userIds,deptIds:d.deptIds,externals:d.externals});closeSheet();toast(fromCreate?"群组已创建":"成员已更新");refresh();}catch(e){toast(e.message,true);}
      };
    }

    function refreshRecords(){
      $("recordsBox").innerHTML=`<h2>发送记录</h2><table><thead><tr><th>时间</th><th>标题</th><th>摘要</th><th>结果</th><th></th></tr></thead><tbody>
        ${M.state.records.map(r=>`<tr>
          <td class="mono">${esc(r.time)}</td><td>${esc(r.title)}</td><td class="mute">${esc(r.recipientSummary)}</td>
          <td>${r.results.map(x=>`<span class="${x.status==="SUCCESS"?"ok":"bad"}">${esc(M.channelById(x.channelId)?.name)}:${x.status}</span>`).join("<br>")}</td>
          <td><button class="ghost" data-i="${r.id}" type="button">详情</button></td></tr>`).join("")||`<tr><td colspan="5" class="mute">暂无</td></tr>`}
        </tbody></table>`;
      $("recordsBox").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
        const r=M.state.records.find(x=>x.id===b.dataset.i);
        openSheet(`<h2>详情</h2><pre class="mono" style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px">${esc(r.title)}\n${esc(r.time)}\n${esc(r.recipientSummary)}\n\n${esc(r.content)}\n\n${r.results.map(x=>`${M.channelById(x.channelId)?.name}: ${x.status} (${x.detail})`).join("\n")}</pre><div class="bar"><button class="go" type="button" id="x">关闭</button></div>`);
        $("x").onclick=closeSheet;
      });
    }

    function refreshTokens(){
      $("tokensBox").innerHTML=`<div class="toolbar"><h2 style="margin:0;flex:1">开放 Token</h2><button class="go" type="button" id="newT">新建</button></div>
        <p class="mute" style="font-size:12px;margin:0 0 10px">Token=调用方身份，可配允许渠道白名单；不是一渠一 Token。</p>
        <table><thead><tr><th>名称</th><th>Token</th><th>允许渠道</th><th>状态</th><th></th></tr></thead><tbody>
        ${M.state.tokens.map(t=>`<tr>
          <td>${esc(t.name)}</td><td class="mono">${esc(t.token)}</td><td class="mute">${esc(M.tokenScopeText(t))}</td><td>${t.status==="1"?"启用":"停用"}</td>
          <td>
            <button class="ghost" data-c="${t.token}" type="button">复制</button>
            <button class="ghost" data-e="${t.id}" type="button">编辑</button>
            <button class="ghost" data-t="${t.id}" type="button">${t.status==="1"?"停用":"启用"}</button>
            <button class="ghost danger" data-d="${t.id}" type="button">删除</button>
          </td></tr>`).join("")}
        </tbody></table>`;
      $("newT").onclick=()=>editToken();
      $("tokensBox").querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.c);toast("已复制");}catch{toast("复制失败",true);}});
      $("tokensBox").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editToken(b.dataset.e));
      $("tokensBox").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=M.state.tokens.find(x=>x.id===b.dataset.t);M.saveToken({id:t.id,name:t.name,expireTime:t.expireTime,status:t.status==="1"?"0":"1",allowedChannelIds:t.allowedChannelIds||[]});toast("已更新");refresh();});
      $("tokensBox").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("删除 Token？")){M.removeToken(b.dataset.d);toast("已删除");refresh();}});
    }
    function editToken(id){
      const t=id?M.state.tokens.find(x=>x.id===id):{name:"",expireTime:"",status:"1",allowedChannelIds:[]};
      openSheet(`<h2>${id?"编辑":"新建"} Token</h2>${F.tokenScopeFields(t)}
        <div class="bar"><button class="ghost" type="button" id="x">取消</button><button class="go" type="button" id="s">保存</button></div>`);
      $("x").onclick=closeSheet;
      $("s").onclick=()=>{try{const body=F.readTokenForm(id?t:null);const saved=M.saveToken({...body,id:id||undefined});closeSheet();toast(id?"已保存":"已创建 "+saved.token);refresh();}catch(e){toast(e.message,true);}};
    }

    function refreshInbox(){
      $("inboxBox").innerHTML=`<div class="toolbar"><h2 style="margin:0;flex:1">收件箱</h2><button class="ghost" type="button" id="readAll">全部已读</button></div>
        <table><thead><tr><th>状态</th><th>标题</th><th>时间</th><th></th></tr></thead><tbody>
        ${M.state.inbox.map(m=>`<tr>
          <td>${m.read?"已读":"<span class='ok'>未读</span>"}</td><td>${esc(m.title)}</td><td class="mono mute">${esc(m.time)}</td>
          <td><button class="ghost" data-o="${m.id}" type="button">打开</button></td></tr>`).join("")||`<tr><td colspan="4" class="mute">空</td></tr>`}
        </tbody></table>`;
      $("readAll").onclick=()=>{M.markAllInboxRead();toast("已全部已读");refresh();};
      $("inboxBox").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
        const m=M.markInboxRead(b.dataset.o);
        openSheet(`<h2>${esc(m.title)}</h2><p class="mute mono">${esc(m.time)}</p><pre class="mono" style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px">${esc(m.content)}</pre><div class="bar"><button class="go" type="button" id="x">关闭</button></div>`);
        $("x").onclick=()=>{closeSheet();refresh();};
      });
    }

    function refresh(){
      refreshComposeSide();
      refreshChannels();
      refreshGroups();
      refreshRecords();
      refreshTokens();
      refreshInbox();
    }
    refresh();
  </script>
</body>
</html>
